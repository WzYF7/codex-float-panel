name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pyinstaller
      - run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name CodexFloat --icon src/icon.ico
          --paths src --hidden-import nav_core src/float_nav.py
      - uses: actions/upload-artifact@v4
        with:
          name: CodexFloat-win64
          path: dist/CodexFloat.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/CodexFloat.exe

